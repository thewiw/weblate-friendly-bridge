# Deploy from a plain clone — only Docker is needed on the host (no
# Node/npm): `docker compose up -d --build` compiles the app inside the
# build (multi-stage Dockerfile), then runs it.
services:
  weblate-friendly-bridge:
    build:
      # Context is the repo root (sources + lockfile); the Dockerfile
      # is in this docker/ directory and builds dist/ in a node builder
      # stage. COPY paths in the Dockerfile are relative to the context.
      context: ..
      dockerfile: docker/Dockerfile
    image: weblate-friendly-bridge:latest
    # Override with WFB_CONTAINER_NAME (e.g. WFB_CONTAINER_NAME=wfb-dev docker compose up -d --build).
    container_name: ${WFB_CONTAINER_NAME:-weblate-friendly-bridge}
    restart: unless-stopped
    ports:
      # Host side via WFB_CONTAINER_PORT: a port ("8080" → 0.0.0.0:8080)
      # or an "ip:port" binding ("127.0.0.1:8080" or "192.168.1.5:8080").
      # The container-side port stays 4000.
      - '${WFB_CONTAINER_PORT:-4000}:4000'
    environment:
      # Base URL of the Weblate instance (no trailing slash).
      # Must be reachable from INSIDE the container:
      #   - Weblate on the host's localhost -> http://host.docker.internal:<port>
      #     (the extra_hosts below makes that name resolve)
      #   - Weblate elsewhere on the LAN    -> http://<lan-ip> (default)
      WFB_WEBLATE_URL: ${WFB_WEBLATE_URL:-}
      # Omit to run in session mode (users sign in via the login view).
      WFB_WEBLATE_API_KEY: ${WFB_WEBLATE_API_KEY:-}
      WFB_WEBLATE_REVIEW_WORKFLOW: ${WFB_WEBLATE_REVIEW_WORKFLOW:-true}
      WFB_MOCK_WEBLATE: ${WFB_MOCK_WEBLATE:-false}
      WFB_PORT: 4000
      # Public (key-less) REST export: both must be set to allow export
      # requests without an API key from the allowed CIDR hosts.
      WFB_WEBLATE_EXPORT_API_KEY: ${WFB_WEBLATE_EXPORT_API_KEY:-}
      WFB_WEBLATE_EXPORT_ALLOWED_HOSTS: ${WFB_WEBLATE_EXPORT_ALLOWED_HOSTS:-}
      # Opt-in Swagger UI docs (/openapi/): true/on/1 read-only, try /
      # with-try / with_try / swagger-with-try / swagger_with_try also
      # enable "Try it out" (case-insensitive).
      WFB_OPENAPI: ${WFB_OPENAPI:-}
    # Needed only when WFB_WEBLATE_URL points at a service on the host's loopback.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:4000/api/v1/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
