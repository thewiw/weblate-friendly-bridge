<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weblate Friendly Bridge — REST API</title>
    <link rel="stylesheet" href="./swagger-ui.css" />
    <link rel="icon" type="image/png" href="./favicon-32x32.png" />
    <style>
      body { margin: 0; }
      #swagger .topbar { display: none; }
      #error { padding: 2rem; font-family: sans-serif; color: #b91c1c; }
    </style>
  </head>
  <body>
    <div id="swagger"></div>
    <script src="./swagger-ui-bundle.js" crossorigin></script>
    <script>
      // Self-hosted Swagger UI (assets vendored in this directory — no CDN).
      // The spec comes from the server: GET /api/rest/v1/openapi.json, whose
      // `x-try-it-out` extension controls whether the "Try it out" button is
      // active (SWAGGER_UI=with-try; read-only docs otherwise).
      window.addEventListener('load', async () => {
        let spec;
        try {
          const res = await fetch('/api/rest/v1/openapi.json');
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          spec = await res.json();
        } catch (err) {
          const div = document.createElement('div');
          div.id = 'error';
          div.textContent = `Cannot load the API spec from /api/rest/v1/openapi.json (${err.message}).`;
          document.body.appendChild(div);
          return;
        }
        const tryIt = spec['x-try-it-out'] === true;
        window.ui = SwaggerUIBundle({
          dom_id: '#swagger',
          spec,
          deepLinking: true,
          // API keys are pasted per request via the Authorize button; the
          // spec declares the Authorization/X-API-Key header schemes.
          withCredentials: false,
          // "Try it out" only when the server enables it; otherwise no way
          // to fire a request from the docs at all.
          tryItOutEnabled: tryIt,
          supportedSubmitMethods: tryIt ? ['get', 'post', 'put', 'patch', 'delete'] : [],
        });
      });
    </script>
  </body>
</html>
